# Preparation only. This file has not been deployed.
services:
  - type: web
    name: isolated-fake-accounting-mcp-test
    runtime: node
    plan: free
    numInstances: 1
    buildCommand: npm ci --ignore-scripts
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: off
    envVars:
      - key: NODE_VERSION
        value: 22.22.0
      - key: HOST
        value: 0.0.0.0
      - key: MOCK_APPROVAL_FIXTURES
        value: enabled
